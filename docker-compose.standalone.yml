version: '3.8'

services:
  # Backend API service
  api:
    build:
      context: .
      dockerfile: Dockerfile.standalone
    ports:
      - "3000:3000" 
    environment:
      - PORT=3000
    command: node api/index.js
    networks:
      - app-network
    restart: unless-stopped

  # Frontend web service with proxy setup
  web:
    build:
      context: .
      dockerfile: Dockerfile.standalone
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - API_URL=http://api:3000
    command: node web/index.js
    depends_on:
      - api
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge